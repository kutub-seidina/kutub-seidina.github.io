<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6B4F3A">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="تأكيد نجاح إرسال بلاغ إعادة كتاب.">
  <title>تم إرسال البلاغ | مكتبة شخصية</title>
  <script>
    (function() {
      let savedLang = null;
      try {
        savedLang = localStorage.getItem("kutub-seidina:language");
      } catch (_) {
        savedLang = null;
      }
      const browserLang = (navigator.language || navigator.userLanguage || "ar").startsWith("ar") ? "ar" : "en";
      const activeLang = (savedLang === "ar" || savedLang === "en") ? savedLang : browserLang;
      document.documentElement.lang = activeLang;
      document.documentElement.dir = activeLang === "ar" ? "rtl" : "ltr";
      document.documentElement.classList.remove("ar-active", "en-active");
      document.documentElement.classList.add(activeLang + "-active");
      
      const titles = {
        ar: "تم إرسال البلاغ | مكتبة سَيْدِنا",
        en: "Report Sent | Saydina Library"
      };
      document.title = titles[activeLang];
      
      document.documentElement.classList.add("i18n-pending");
      
      window.setTimeout(function() {
        document.documentElement.classList.remove("i18n-pending");
      }, 1500);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <script src="./assets/js/i18n.js" defer></script>
  <script src="./assets/js/thanks.js" defer></script>
</head>
<body class="page-thanks">
  <main class="card">
    <button class="lang-switch" id="langSwitch" aria-label="Switch to English" lang="en" hidden>English</button>
    <div class="success-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m5 12 4 4L19 6"/>
      </svg>
    </div>

    <h1 data-i18n="thanks.title">تم إرسال البلاغ بنجاح</h1>
    <p class="lead" data-i18n="thanks.desc">
      شكرًا لأمانتك. سنتواصل معك عبر الوسيلة التي اخترتها لترتيب إعادة الكتاب.
    </p>

    <p class="note" data-i18n="thanks.note">يمكنك الآن إغلاق هذه الصفحة، ولا حاجة إلى إرسال البلاغ مرة أخرى.</p>

    <div class="actions">
      <a class="button button-primary" href="./" data-i18n="thanks.btnHome">العودة إلى الصفحة الرئيسية</a>
      <a class="button button-secondary" href="./#reportFormTitle" data-i18n="thanks.btnAnother">إرسال بلاغ آخر</a>
    </div>

    <p class="library"><strong data-i18n="footer.libraryName">مكتبة سَيْدِنا الشخصية</strong><br><span data-i18n="footer.text">شكرًا لحرصك على إعادة الكتب إلى أصحابها.</span></p>
  </main>
</body>
</html>
